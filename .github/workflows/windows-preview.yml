name: Windows preview (unsigned)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # This project uses only free standard runners in PUBLIC repositories.
    if: github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.10'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          gradle-version: '9.3.0'
          cache-disabled: true
      - name: Test, build and package unsigned preview
        shell: pwsh
        run: ./build-windows.ps1
      - name: Verify native EXE desktop installation
        shell: pwsh
        run: |
          $tarDesktop = [Environment]::GetFolderPath('DesktopDirectory')
          if ([string]::IsNullOrWhiteSpace($tarDesktop)) { throw 'Runner desktop unavailable.' }
          New-Item -ItemType Directory -Force -Path $tarDesktop | Out-Null
          $tarExe = (Resolve-Path -LiteralPath './dist/Tar Client/Tar Client.exe').Path
          $tarProcess = Start-Process -FilePath $tarExe -ArgumentList '--install-desktop','--quiet' -WindowStyle Hidden -PassThru -RedirectStandardOutput './dist/desktop-install.stdout' -RedirectStandardError './dist/desktop-install.stderr'
          $tarFinished = $tarProcess.WaitForExit(120000)
          Get-Content -LiteralPath './dist/desktop-install.stdout','./dist/desktop-install.stderr'
          if (-not $tarFinished) { $tarProcess.Kill(); throw 'Desktop installer timed out.' }
          if ($tarProcess.ExitCode -ne 0) { throw "Desktop installer exited with $($tarProcess.ExitCode)." }
          $tarShortcutPath = Join-Path $tarDesktop 'Tar Client.lnk'
          if (-not (Test-Path -LiteralPath $tarShortcutPath)) { throw 'Desktop shortcut was not created.' }
          $tarShortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($tarShortcutPath)
          $tarTarget = [IO.Path]::GetFullPath($tarShortcut.TargetPath)
          $tarInstallRoot = [IO.Path]::GetFullPath((Join-Path $env:LOCALAPPDATA 'Programs/Tar Client'))
          if (-not $tarTarget.StartsWith($tarInstallRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) { throw 'Shortcut points outside the user installation.' }
          if (-not (Test-Path -LiteralPath $tarTarget)) { throw 'Installed executable is missing.' }
          $tarInstalledDir = Split-Path $tarTarget
          foreach ($tarRelative in @('app/tar-launcher.jar','app/Tar Client.cfg','runtime/bin/java.exe','runtime/lib/modules')) {
            $tarOriginal = Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path (Split-Path $tarExe) $tarRelative)
            $tarInstalled = Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $tarInstalledDir $tarRelative)
            if ($tarOriginal.Hash -ne $tarInstalled.Hash) { throw "Installed file differs: $tarRelative" }
          }
          Write-Output 'Native EXE created a valid desktop shortcut and copied the complete runtime.'
      - name: Audit native signatures (launcher is currently unsigned)
        shell: pwsh
        run: ./sign-windows.ps1 -PackagePath './dist/Tar Client'
      - name: Upload preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TarClient-Windows-UNSIGNED-${{ github.sha }}
          path: |
            dist/TarClient-0.4.1-Windows.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: launcher-test-results
          path: launcher/build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

